plugins {
	id 'fabric-loom' version '1.14.10'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "TerraformersMC"
		url = "https://maven.terraformersmc.com/"
	}
}

loom {
	splitEnvironmentSourceSets()
	accessWidenerPath = file("src/main/resources/worlddownloader.accesswidener")

	mods {
		"worlddownloader" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	// Automatischer Spieltest: ./gradlew runClientGameTest  (headless: xvfb-run ./gradlew runClientGameTest)
	configureTests {
		createSourceSet = true
		modId = "worlddownloader-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	modImplementation "com.terraformersmc:modmenu:17.0.0"
}

processResources {
	inputs.property "version", project.version
	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

// Kopiert die gebaute JAR in einen Mods-Ordner.
// Pfad in ~/.gradle/gradle.properties setzen:  wdModsDir=/pfad/zu/.minecraft/mods
tasks.register('installMod', Copy) {
	dependsOn remapJar
	onlyIf { project.hasProperty('wdModsDir') }
	def modsDir = project.findProperty('wdModsDir')
	from remapJar.archiveFile
	into modsDir ?: "${buildDir}/install"
	doFirst {
		file(modsDir).listFiles()?.findAll { it.name.startsWith("worlddownloader-") && it.name.endsWith(".jar") }?.each {
			println "Deleting old: ${it.name}"
			it.delete()
		}
	}
}
